<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Google</title>
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- 관리자가 이 앱을 안 보이게 한 사람은 앱 목록으로 돌려보낸다 -->
  <script src="/app-guard.js" data-app="proxy"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%239aa0a6' stroke-width='2.2'%3E%3Ccircle cx='16' cy='16' r='12'/%3E%3Cpath d='M4 16h24M16 4c4 4 4 20 0 24M16 4c-4 4-4 20 0 24'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff; --bg-soft: #f2f2f2; --bg-hover: #e5e5e5; --text: #0f0f0f; --text-sub: #606060;
      --border: #e0e0e0; --accent: #6366f1;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0f0f; --bg-soft: #222222; --bg-hover: #333333; --text: #f1f1f1; --text-sub: #aaaaaa; --border: #303030; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .btn { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: inherit; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--bg-hover); }
    .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    form.addr { flex: 1; min-width: 0; display: flex; }
    .addr input { width: 100%; height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--border); background: var(--bg-soft); color: inherit; font-size: 15px; outline: none; }
    .addr input:focus { border-color: var(--accent); background: var(--bg); }
    main { flex: 1; position: relative; min-height: 0; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    .start { position: absolute; inset: 0; overflow: auto; padding: 48px 16px; text-align: center; }
    .start h1 { margin: 0 0 8px; font-size: 26px; }
    .start p { margin: 0 0 24px; color: var(--text-sub); line-height: 1.6; }
    .big { max-width: 560px; margin: 0 auto 28px; display: flex; }
    .big input { flex: 1; min-width: 0; height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid var(--border); background: var(--bg-soft); color: inherit; font-size: 16px; outline: none; }
    .big input:focus { border-color: var(--accent); background: var(--bg); }
    .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 560px; margin: 0 auto; }
    .favs { max-width: 560px; margin: 0 auto 18px; }
    .favs-title { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
    .fav-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .fav { display: flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg); overflow: hidden; }
    .fav button { background: none; border: 0; color: inherit; cursor: pointer; }
    .fav .fav-open { padding: 9px 4px 9px 14px; font-size: 14px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fav .fav-open:hover { color: var(--accent); }
    .fav .fav-del { padding: 9px 12px 9px 6px; color: var(--text-sub); font-size: 16px; line-height: 1; }
    .fav .fav-del:hover { color: #e5484d; }
    .btn.on { color: var(--accent); }
    .btn.on svg { fill: currentColor; stroke: currentColor; }
    .links button { padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: inherit; font-size: 14px; cursor: pointer; }
    .links button:hover { background: var(--bg-hover); }
    .msg { color: var(--text-sub); }
    .msg a { color: var(--accent); }
    .stuck { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto;
      padding: 18px 20px; border-radius: 14px; background: var(--bg); color: var(--text); border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,.18); z-index: 2; }
    .stuck h2 { margin: 0 0 6px; font-size: 17px; }
    .stuck p { margin: 0 0 10px; color: var(--text-sub); font-size: 14px; line-height: 1.5; }
    .stuck ul { margin: 0 0 12px; padding-left: 18px; font-size: 12px; color: var(--text-sub); word-break: break-all; font-family: ui-monospace, monospace; }
    .stuck button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .stuck button { padding: 8px 14px; border-radius: 18px; border: 1px solid var(--border); background: var(--bg-soft); color: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="btn" href="/#/" target="_top" title="앱 목록" aria-label="앱 목록">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <button class="btn" id="homeBtn" title="처음 화면" aria-label="처음 화면">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button class="btn" id="reloadBtn" title="새로고침" aria-label="새로고침">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    </button>
    <form class="addr" id="addrForm">
      <input id="addr" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="주소나 검색어 입력">
    </form>
    <button class="btn" id="warnBtn" hidden title="문제 보기" aria-label="문제 보기" style="color:#f59e0b">
      <svg viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.01"/></svg>
    </button>
    <button class="btn" id="favBtn" hidden title="즐겨찾기에 넣기" aria-label="즐겨찾기에 넣기">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 21l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>
    </button>
  </div>
  <main>
    <div class="start" id="start">
      <h1>프록시</h1>
      <p>보고 싶은 사이트 주소나 검색어를 넣으세요.<br>모든 요청이 이 서버를 거쳐서 열려요.</p>
      <form class="big" id="bigForm"><input id="bigInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="예: ko.wikipedia.org 또는 검색어" autofocus></form>
      <div class="favs" id="favs" hidden><div class="favs-title">즐겨찾기</div><div class="fav-list" id="favList"></div></div>
      <div class="links" id="links"></div>
      <p class="msg" id="msg" hidden></p>
    </div>
    <div class="stuck" id="stuck" hidden>
      <h2 id="stuckTitle">화면이 안 나왔어요</h2>
      <p>이 사이트는 프록시로 잘 안 열리는 것 같아요. 인스타그램처럼 <b>다른 사이트 안에 들어가 있으면 일부러 안 보이는</b> 사이트도 있어요. 아래 내용을 캡처해서 보내 주면 고칠 수 있는지 볼게요.</p>
      <ul id="stuckList"></ul>
      <button type="button" id="stuckClose">닫기</button>
    </div>
    <iframe id="view" hidden title="프록시 화면"
      sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-pointer-lock"
      allow="fullscreen; autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
  </main>
  <script>
    // 로그인한 사람만 쓸 수 있다. /api/proxy/token 에서 받은 표로 /p/<표>/https/<사이트>/... 주소를 만든다.
    const SEARCH = 'https://html.duckduckgo.com/html/?q=';
    const QUICK = [
      ['DuckDuckGo', 'https://html.duckduckgo.com/html/'],
      ['위키백과', 'https://ko.wikipedia.org/'],
      ['나무위키', 'https://namu.wiki/'],
      ['네이버', 'https://m.naver.com/'],
      ['Reddit', 'https://old.reddit.com/']
    ];
    // 프록시로 보던 사이트에서 돌아왔으면 그 표시(window.name)를 지운다 (public/404.html 참고)
    try { if ((window.name || '').indexOf('__px:') === 0) window.name = ''; } catch { /* 괜찮음 */ }
    const $ = (id) => document.getElementById(id);
    const view = $('view'), start = $('start'), addr = $('addr'), msg = $('msg');
    let token = null, expiresAt = 0, current = '';
    // 받은 표는 이 브라우저에 기억해 둔다 (다시 들어와도 서버를 안 기다리고, 주소가 같아서 캐시도 먹힘)
    try {
      const saved = JSON.parse(localStorage.getItem('proxyToken') || 'null');
      if (saved && saved.expiresAt - Date.now() > 10 * 60 * 1000) ({ token, expiresAt } = saved);
    } catch { /* 저장소를 못 쓰면 매번 받는다 */ }

    async function getToken() {
      if (token && expiresAt - Date.now() > 10 * 60 * 1000) return token;
      const res = await fetch('/api/proxy/token', { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || '프록시를 열지 못했어요.');
        err.login = res.status === 401 || data.code === 'LOGIN_REQUIRED' || data.code === 'BLOCKED';
        throw err;
      }
      token = data.token;
      expiresAt = data.expiresAt;
      try { localStorage.setItem('proxyToken', JSON.stringify({ token, expiresAt })); } catch { /* 괜찮음 */ }
      return token;
    }

    // "naver.com" → https://naver.com/, "고양이" → 검색
    function toUrl(text) {
      const s = text.trim();
      if (!s) return '';
      if (/^https?:\/\//i.test(s)) return s;
      if (!/\s/.test(s) && /^[^/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(s)) return 'https://' + s;
      return SEARCH + encodeURIComponent(s);
    }

    function proxyPath(url, tok) {
      const u = new URL(url);
      // 사이트 주소는 감춰서 넣는다 (방문 기록에 사이트 이름이 그대로 안 보이게, src/proxy.js 와 같은 방식)
      const code = btoa(u.origin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      return `/p/${tok}/x/${code}${u.pathname}${u.search}${u.hash}`;
    }

    // 예전 '전체 화면' 기능이 남긴 기록은 지운다
    try { localStorage.removeItem('proxyFullHosts'); } catch { /* 괜찮음 */ }

    // 지금 보는 사이트를 이 탭에만 기억해 둔다. 이동 단축키로 갔다가 뒤로 가기로 돌아오면 다시 연다.
    function rememberLast(url) {
      try { sessionStorage.setItem('proxyLast', url); } catch { /* 괜찮음 */ }
    }

    // ---------- 즐겨찾기 (이 브라우저에만 저장) ----------
    const FAV_KEY = 'proxyFavorites';
    function loadFavs() {
      try { const a = JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch { return []; }
    }
    function saveFavs(list) {
      try { localStorage.setItem(FAV_KEY, JSON.stringify(list.slice(0, 50))); } catch { /* 괜찮음 */ }
    }
    function favName(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
    }
    function isFav(url) {
      return loadFavs().some((f) => f.url === url);
    }
    function toggleFav() {
      if (!current) return;
      const list = loadFavs();
      const i = list.findIndex((f) => f.url === current);
      if (i >= 0) list.splice(i, 1);
      else list.unshift({ url: current, name: favName(current) });
      saveFavs(list);
      updateFavBtn();
      renderFavs();
    }
    function updateFavBtn() {
      const on = !!current && isFav(current);
      $('favBtn').hidden = !current;
      $('favBtn').classList.toggle('on', on);
      $('favBtn').title = on ? '즐겨찾기에서 빼기' : '즐겨찾기에 넣기';
    }
    function renderFavs() {
      const list = loadFavs();
      $('favs').hidden = list.length === 0;
      $('favList').replaceChildren(...list.map((f) => {
        const open = document.createElement('button');
        open.type = 'button'; open.className = 'fav-open'; open.textContent = f.name || favName(f.url); open.title = f.url;
        open.addEventListener('click', () => go(f.url));
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'fav-del'; del.textContent = '×'; del.setAttribute('aria-label', (f.name || favName(f.url)) + ' 빼기');
        del.addEventListener('click', () => { saveFavs(loadFavs().filter((x) => x.url !== f.url)); updateFavBtn(); renderFavs(); });
        const wrap = document.createElement('div'); wrap.className = 'fav';
        wrap.append(open, del);
        return wrap;
      }));
    }

    function showMessage(text, login) {
      view.hidden = true;
      start.hidden = false;
      msg.hidden = false;
      msg.textContent = text + ' ';
      if (login) {
        const a = document.createElement('a');
        a.href = '/#/';
        a.textContent = '로그인하러 가기';
        msg.append(a);
      }
    }

    async function go(text) {
      const url = toUrl(text);
      if (!url) return;
      try { new URL(url); } catch { return showMessage('주소가 올바르지 않아요.'); }
      let tok;
      try { tok = await getToken(); } catch (e) { return showMessage(e.message, e.login); }
      current = url;
      addr.value = url;
      msg.hidden = true;
      start.hidden = true;
      view.hidden = false;
      $('stuck').hidden = true;
      $('warnBtn').hidden = true;
      rememberLast(url);
      updateFavBtn();
      view.src = proxyPath(url, tok);
    }

    // 프록시로 연 페이지가 지금 주소와 제목을 알려 준다
    addEventListener('message', (e) => {
      if (e.source !== view.contentWindow) return;
      if (e.data?.type === 'proxy-expired') {
        if (!token) return;
        token = null;
        try { localStorage.removeItem('proxyToken'); } catch { /* 괜찮음 */ }
        if (current) go(current);
        return;
      }
      if (e.data?.type === 'proxy-status') {
        const list = Array.isArray(e.data.errors) ? e.data.errors : [];
        $('stuckList').replaceChildren(...(list.length ? list : ['(오류 기록 없음: 페이지가 아무것도 안 그렸어요)']).map((t) => {
          const li = document.createElement('li');
          li.textContent = String(t);
          return li;
        }));
        const li = document.createElement('li');
        li.textContent = '주소: ' + current;
        $('stuckList').append(li);
        $('stuckTitle').textContent = e.data.empty ? '화면이 안 나왔어요' : '일부가 안 불러와졌어요';
        $('stuck').hidden = !e.data.empty;
        // 화면은 나왔지만 실패한 요청이 있으면 위쪽에 ⚠ 버튼을 보여 준다 (누르면 목록)
        $('warnBtn').hidden = !list.length || !!e.data.empty;
        return;
      }
      if (e.data?.type !== 'proxy-page') return;
      current = String(e.data.url || '');
      rememberLast(current);
      updateFavBtn();
      if (document.activeElement !== addr) addr.value = current;
    });

    $('addrForm').addEventListener('submit', (e) => { e.preventDefault(); addr.blur(); go(addr.value); });
    $('bigForm').addEventListener('submit', (e) => { e.preventDefault(); go($('bigInput').value); });
    $('reloadBtn').addEventListener('click', () => { if (current) go(current); });
    $('stuckClose').addEventListener('click', () => { $('stuck').hidden = true; });
    $('warnBtn').addEventListener('click', () => { $('stuck').hidden = !$('stuck').hidden; });
    $('favBtn').addEventListener('click', toggleFav);
    renderFavs();
    $('homeBtn').addEventListener('click', () => {
      $('stuck').hidden = true;
      view.hidden = true; view.removeAttribute('src'); start.hidden = false; addr.value = ''; current = '';
      try { sessionStorage.removeItem('proxyLast'); } catch { /* 괜찮음 */ }
      updateFavBtn(); renderFavs();
      $('bigInput').focus();
    });
    for (const [name, url] of QUICK) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.addEventListener('click', () => go(url));
      $('links').append(b);
    }
    // 들어올 때 로그인돼 있는지 미리 확인
    // 이동 단축키로 갔다가 돌아온 거면 보던 사이트를 다시 연다
    let resume = '';
    try {
      if (sessionStorage.getItem('proxyResume') === '1') resume = sessionStorage.getItem('proxyLast') || '';
      sessionStorage.removeItem('proxyResume');
    } catch { /* 괜찮음 */ }
    if (/^https?:\/\//i.test(resume)) go(resume);
    else getToken().catch((e) => showMessage(e.message, e.login));
  </script>
  <script type="module">
    // 이 화면의 탭도 메인 사이트에서 정한 탭 모양으로
    import { applyDisguise } from '/disguise.js';
    import { loadJump, matchesShortcut, isTypingKey, isTypingTarget } from '/shortcuts.js';
    applyDisguise();

    // 이동 단축키: 이 화면이나 프록시로 연 사이트 안에서 눌러도 동작하게 한다.
    // 메인 사이트(#/proxy) 안에 있으면 메인 화면에 알려서 이동하고(뒤로 가기로 돌아올 수 있음), 따로 열려 있으면 직접 이동한다.
    function jumpNow() {
      const jump = loadJump();
      if (!jump) return;
      if (window.top !== window) window.top.postMessage({ type: 'sy-jump' }, location.origin);
      else location.href = jump.url;
    }
    function check(e, typing) {
      const jump = loadJump();
      if (!jump || !matchesShortcut(e, jump.shortcut)) return false;
      if (isTypingKey(jump.shortcut) && typing) return false;
      jumpNow();
      return true;
    }
    addEventListener('keydown', (e) => { if (check(e, isTypingTarget(e.target))) e.preventDefault(); }, true);
    addEventListener('message', (e) => {
      const d = e.data;
      if (e.source !== document.getElementById('view').contentWindow || d?.type !== 'proxy-key') return;
      check({ code: String(d.code), ctrlKey: !!d.ctrl, altKey: !!d.alt, shiftKey: !!d.shift, metaKey: !!d.meta }, !!d.typing);
    });
  </script>
</body>
</html>
