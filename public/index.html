<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School YouTube</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310b981'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menuBtn" aria-label="메뉴">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a href="#/" class="logo" aria-label="School YouTube 홈">
        <span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M9 6.5l9 5.5-9 5.5z"/></svg></span>
        <span class="logo-text">School YouTube</span>
      </a>
    </div>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="검색" aria-label="검색어">
        <ul id="suggestions" class="suggestions" hidden></ul>
      </div>
      <button class="search-btn" type="submit" aria-label="검색">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      </button>
    </form>
    <div class="topbar-right">
      <button class="icon-btn" id="themeBtn" aria-label="테마 전환">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>홈</span>
    </a>
    <a href="#/c/music" data-nav="music">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>음악</span>
    </a>
    <a href="#/c/game" data-nav="game">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11h.01M18 14h.01"/></svg><span>게임</span>
    </a>
    <a href="#/c/news" data-nav="news">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg><span>뉴스</span>
    </a>
    <a href="#/c/sports" data-nav="sports">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg><span>스포츠</span>
    </a>
  </nav>

  <main id="app" class="content"></main>

  <template id="cardTpl">
    <a class="card">
      <div class="thumb"><img loading="lazy" alt=""><span class="duration"></span></div>
      <div class="card-body">
        <img class="avatar" loading="lazy" alt="">
        <div class="card-text">
          <h3 class="card-title"></h3>
          <span class="card-channel"></span>
          <span class="card-meta"></span>
        </div>
      </div>
    </a>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
