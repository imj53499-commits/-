<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 탭</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%239aa0a6' stroke-width='2.2'%3E%3Ccircle cx='16' cy='16' r='12'/%3E%3Cpath d='M4 16h24M16 4c4 4 4 20 0 24M16 4c-4 4-4 20 0 24'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { display: block; width: 100vw; height: 100vh; border: 0; }
    .message { color: #aaa; font: 15px system-ui, sans-serif; padding: 24px; }
    .unmute-btn {
      position: fixed; left: 12px; bottom: 56px; z-index: 2; padding: 8px 14px; border: 0; border-radius: 18px;
      background: rgba(0, 0, 0, .75); color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer;
    }
    .size-bar { position: fixed; top: 8px; right: 8px; z-index: 3; display: flex; gap: 4px; opacity: .35; transition: opacity .15s; }
    .size-bar:hover { opacity: 1; }
    .size-bar button {
      width: 30px; height: 30px; border: 0; border-radius: 8px; background: rgba(0, 0, 0, .7); color: #fff;
      font: 700 18px/1 system-ui, sans-serif; cursor: pointer;
    }
    .size-bar button:hover { background: rgba(0, 0, 0, .9); }
  </style>
</head>

  <script src="/popup.js" type="module"></script>
