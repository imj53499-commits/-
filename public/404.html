<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <meta name="robots" content="noindex">
  <script>
    // 프록시로 보던 사이트가 새로고침하거나 /webtoon 같은 경로로 이동하면 여기로 온다.
    // 프록시 페이지가 window.name 에 남긴 '/p/<표>/https/<사이트>' 를 붙여서 원래 사이트로 되돌린다.
    (function () {
      try {
        var n = window.name || '';
        if (n.indexOf('__px:') !== 0) return;
        var d = JSON.parse(n.slice(5));
        if (!/^\/p\/[^\/?#]+\/(https?\/[^\/?#]+|x\/[A-Za-z0-9_-]+)$/.test(d.r)) return;
        location.replace(d.r + location.pathname + location.search + location.hash);
      } catch (e) { /* 그냥 안내 화면 */ }
    })();
  </script>
  <style>
    :root { --bg: #fff; --text: #0f0f0f; --sub: #606060; --accent: #6366f1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0f0f; --text: #f1f1f1; --sub: #aaa; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    div { padding: 24px 16px; text-align: center; }
    p { color: var(--sub); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div>
    <h1>페이지를 찾을 수 없어요</h1>
    <p><a href="/#/">앱 목록으로 가기</a></p>
  </div>
</body>
</html>
